[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptloop"
version = "0.1.0"
description = "Run a Markdown prompt template over every row of a CSV through a chatbot web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
promptloop = "app.main:main"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
